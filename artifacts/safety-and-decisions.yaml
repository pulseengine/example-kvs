# Safety analysis (FMEA) + decision records for persistency::kvs.
# Mirrors eclipse-score's feat_saf_fmea / comp_saf_fmea / dec_rec
# need types.

artifacts:

  # ── FMEA entries ───────────────────────────────────────────────────

  - id: FMEA-KVS-SILENT-CORRUPTION
    type: fmea-entry
    title: Silent corruption of stored value
    status: approved
    description: >
      Power loss mid-write leaves a stored value in a torn state,
      not detected by integrity check.
      Eclipse: comp_saf_fmea__kvs__silent_corruption.
    fields:
      safety-level: ASIL_B
      failure-mode: Stored value partially written after power loss
      effect: >
        Subsequent load returns a syntactically valid but stale or
        torn payload to the consumer
      cause: Buffered write interrupted before fsync completes
      severity: "8"
      occurrence: "3"
      detection: "5"
      rpn: "120"
    tags: [persistency, kvs, safety]
    links:
      - type: belongs-to
        target: COMP-KVS
      - type: violates
        target: COMP-REQ-KVS-ATOMIC-STORE
      - type: is-mitigated-by
        target: DD-DYN-KVS-ATOMIC-STORE

  - id: FMEA-KVS-CHECKSUM-BYPASS
    type: fmea-entry
    title: Checksum verification bypassed on hot path
    status: approved
    description: >
      An optimisation path skips checksum verification under
      certain conditions, allowing corrupted data through.
    fields:
      safety-level: ASIL_B
      failure-mode: Checksum check not executed on load
      effect: Corrupted value returned without IntegrityError
      cause: >
        Hot-path optimisation skips the verify step when the value
        is freshly cached
      severity: "9"
      occurrence: "2"
      detection: "4"
      rpn: "72"
    tags: [persistency, kvs, safety, integrity]
    links:
      - type: belongs-to
        target: COMP-KVS
      - type: violates
        target: COMP-REQ-KVS-VALUE-CHECKSUM
      - type: is-mitigated-by
        target: DD-STA-KVS-BACKEND-STRATEGY

  # ── Decision records ───────────────────────────────────────────────

  - id: DR-KVS-BACKEND-CHOICE
    type: decision-record
    title: JSON file backend with snapshot rotation (no WAL backend)
    status: approved
    description: Selection of the durable storage backend that ships today.
    fields:
      rationale: >
        Vendored eclipse-score rust_kvs uses a single backend
        (json_backend.rs:401) that writes (key, value) as a tinyjson
        document, computes an Adler32 checksum stored in a sibling
        .hash file, and achieves atomic replace via fs::rename
        snapshot rotation (json_backend.rs:216-254). Adler32 is the
        upstream's checksum-of-record despite the comp_req text
        saying "CRC32C" — that is itself a spec/impl gap.
      alternatives: >
        RocksDB or LevelDB or a bespoke write-ahead log were
        considered upstream but not implemented. The KvsBackend
        trait (kvs_backend.rs:45) exposes an extension point; only
        JsonBackend implements it.
      consequences: >
        Atomicity guarantee is bounded by the POSIX fs::rename
        atomicity (kvs_backend::test_flush_ok and the snapshot_*
        tests cover the rotation path). Snapshot count caps at
        json_backend's snapshot_max_count (default 3, runtime-
        configurable via JsonBackendBuilder::snapshot_max_count).
        No durability guarantee beyond what the filesystem provides.
    tags: [persistency, kvs, decision]
    links:
      - type: satisfies
        target: COMP-REQ-KVS-ATOMIC-STORE
      - type: belongs-to
        target: COMP-KVS

  - id: DR-KVS-INLINE-STORAGE-GAP
    type: decision-record
    title: Inline-storage requirement is unmet by the current backend
    status: approved
    description: Tracking the gap between the spec and the impl.
    fields:
      rationale: >
        COMP-REQ-KVS-INLINE-STORAGE says "no heap allocation on the
        hot path." Vendored rust_kvs uses std::collections::HashMap
        for the in-memory store (kvs.rs) and Arc<Mutex<KvsData>> per
        method (kvs.rs:38-44, etc.) — both allocate. There is no
        allocator-tripwire in the build, and the surface test for
        this comp-req is documented as a gap, not real verification.
      alternatives: >
        (a) wire witness::no_alloc_guard around set_value/get_value
        and have it panic on any allocator call — requires the
        witness toolchain be present; (b) replace HashMap with a
        bounded inline structure (heapless::IndexMap or a custom
        slab) — requires an upstream fork; (c) downgrade COMP-REQ-
        KVS-INLINE-STORAGE to draft and document that ASIL-B inline
        storage is out of scope for this baseline.
      consequences: >
        Until (a), (b), or (c) lands, the comp-req's verified-by:
        list is intentionally empty and the verify gate buckets the
        artifact as MISSING — not falsely PASSED. The gap is
        recorded; the audit trail does not lie.
    tags: [persistency, kvs, decision, memory]
    links:
      - type: satisfies
        target: COMP-REQ-KVS-INLINE-STORAGE
      - type: belongs-to
        target: COMP-KVS

  # ── Test specifications ────────────────────────────────────────────
  # The artifact-driven verification gate (tools/verify.py) looks for
  # tests matching `test_<lowercase-id-with-dashes-as-underscores>_*`
  # for every comp-req with status: approved. Each test-spec below
  # names the test convention explicitly so the artifact ↔ test
  # binding is auditable.

  - id: TEST-SPEC-KVS-KEY-VALIDATOR
    type: test-spec
    title: Key validator unit tests
    status: approved
    description: >
      Unit-level coverage of the syntactic key validator. Boundary
      cases: empty string, single-char, 254/255/256 length,
      alphabet membership, leading-dot rejection.
    fields:
      safety-level: ASIL_B
      test-method: automated-test
      expected-result: All boundary cases pass; invalid keys are rejected.
      mutation-score-target: 0.85
    tags: [persistency, kvs, test]
    links:
      - type: fully-verifies
        target: COMP-REQ-KVS-KEY-NAMING
      - type: belongs-to
        target: COMP-KVS

  - id: TEST-SPEC-KVS-CHECKSUM-FAULT-INJECT
    type: test-spec
    title: Checksum verification fault-injection tests
    status: approved
    description: >
      Fault-injection tests that flip bytes in the backing store
      between store and load. Each load must return IntegrityError.
    fields:
      safety-level: ASIL_B
      test-method: automated-test
      expected-result: Load returns IntegrityError for every injected fault.
    tags: [persistency, kvs, test, integrity]
    links:
      - type: fully-verifies
        target: COMP-REQ-KVS-VALUE-CHECKSUM
      - type: belongs-to
        target: COMP-KVS

  - id: TEST-SPEC-KVS-ATOMIC-STORE-POWERLOSS
    type: test-spec
    title: Atomic-store power-loss simulation
    status: approved
    description: >
      Simulated power-loss between WAL append and table update;
      after recovery, only the previous-value or the new-value
      should be observable, never a torn intermediate.
    fields:
      safety-level: ASIL_B
      test-method: simulation
      expected-result: 100 % of injected power-loss points recover to a consistent state.
    tags: [persistency, kvs, test, durability]
    links:
      - type: fully-verifies
        target: COMP-REQ-KVS-ATOMIC-STORE
      - type: belongs-to
        target: COMP-KVS
