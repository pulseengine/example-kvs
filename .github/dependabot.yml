version: 2
# Grouped monthly updates (fleet template from pulseengine/rivet, owner
# decision 2026-11-21): monthly on the 1st at 02:00 UTC, at most 2 open PRs,
# 7-day cooldown after a release, all actions in one group. Security
# updates ignore the schedule and the limit.
#
# The cargo entry covers the crate_universe inputs (root Cargo.toml and
# Cargo.lock; MODULE.bazel reads only those). lockfile-only: Dependabot
# changes Cargo.lock and never the vendored eclipse-score manifests. Bazel
# runs with --lockfile_mode=error, so a cargo PR goes red at the
# "MODULE.bazel.lock is current" step until a signed commit adds the
# regenerated lock; that step prints the commands and uploads the lock.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "02:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    labels:
      - dependencies
    groups:
      github-actions-all:
        patterns:
          - "*"
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
      time: "02:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    versioning-strategy: lockfile-only
    labels:
      - dependencies
    groups:
      cargo-all:
        patterns:
          - "*"
