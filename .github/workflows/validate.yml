# example-kvs CI — single job that runs the three gates:
#   1. `rivet validate`   typed-artifact graph check
#   2. `bazel build //...` AADL → WIT → wit-bindgen → WASM component
#   3. `python tools/verify.py` artifact-driven verification gate
#      (drives bazel test per comp-req's verified-by entries)
#
# Bazel runs locked: .bazelrc sets --lockfile_mode=error against the
# committed MODULE.bazel.lock (Bazel pinned in .bazelversion), and
# `cargo audit` checks every tracked Cargo.lock.
#
# Note: CI may go RED on purpose. The verify gate runs surface tests
# against the vendored eclipse-score rust_kvs sources. Some of those
# tests assert spec compliance the upstream impl does not enforce;
# when that's the case, the test FAILs and the gate FIREs. That is
# the LS-N demonstration vs. "green-CI-by-default" coverage-wedge
# reporting. See README.md "What this gate measures" for details.

name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: rivet + bazel + verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install rivet
        run: |
          cargo install --git https://github.com/pulseengine/rivet \
              --tag v0.41.1 \
              rivet-cli --bin rivet --locked
          rivet --version

      - name: cargo audit (every tracked Cargo.lock)
        # Loops over git ls-files so a nested Cargo.lock added later is
        # audited without editing this step. Fails on a vulnerability
        # advisory; "unsound"/"unmaintained" warnings are reported only.
        run: |
          cargo install cargo-audit --version 0.22.1 --locked
          locks=$(git ls-files -- 'Cargo.lock' '**/Cargo.lock')
          test -n "$locks"
          for lock in $locks; do
            echo "== $lock"
            cargo audit --file "$lock"
          done

      - name: Install PyYAML for verify.py
        run: pip install pyyaml

      - name: Set up bazelisk
        uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab # 0.19.2
        with:
          bazelisk-version: "1.x"

      - name: rivet validate (typed-artifact graph check)
        run: make validate

      - name: bazel build (AADL → WIT → wit-bindgen → wasm component)
        run: bazel build //...

      - name: stale-lock control (--lockfile_mode=error must fire)
        # Plants a bazel_dep that MODULE.bazel.lock does not contain and
        # expects bazel to refuse it, then restores MODULE.bazel. Fails if
        # error mode is ever switched off or the lock stops being checked.
        shell: bash
        run: |
          set +e -uo pipefail  # GitHub runs bash -e; the expected bazel failure must not end the step
          cp MODULE.bazel "$RUNNER_TEMP/MODULE.bazel.orig"
          echo 'bazel_dep(name = "abseil-py", version = "2.1.0")' >> MODULE.bazel
          bazel mod deps > "$RUNNER_TEMP/stale.log" 2>&1; rc=$?
          cp "$RUNNER_TEMP/MODULE.bazel.orig" MODULE.bazel
          git diff --exit-code -- MODULE.bazel MODULE.bazel.lock || exit 1
          if [ "$rc" -eq 0 ]; then echo "lockfile_mode=error did not fire on a stale lock"; exit 1; fi
          if ! grep -q 'not permitted with --lockfile_mode=error' "$RUNNER_TEMP/stale.log"; then
            cat "$RUNNER_TEMP/stale.log"; exit 1
          fi
          echo "stale lock rejected (bazel exit $rc)"

      - name: verify.py bucketing self-test (rivet and bazel stubbed)
        run: python3 -m unittest discover -s tools -p 'test_verify.py' -v

      - name: artifact-driven verification gate (real bazel test per artifact)
        # verify.py shells out to `bazel test --test_arg=--exact …` per
        # entry in each comp-req's verified-by list. Honest signal: red
        # iff any comp-req has FAILED or MISSING evidence.
        run: make verify
